<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการร้านรับจำนำ Cloud System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        /* ซ่อน Scrollbar ส่วนเกินแต่ยังคงเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <!-- Header Bar (Mobile-Optimized) -->

        <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2.5 sm:space-x-3">

                    <i class="fa-solid fa-store text-lg sm:text-xl"></i>
                </div>
                <div>

                </div>

            <button onclick="openModal('addModal')" class="bg-white text-orange-600 hover:bg-orange-50 font-semibold px-3 py-2 sm:px-4 sm:py-2 rounded-xl shadow-sm text-xs sm:text-sm transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-plus text-sm"></i>

    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-4 sm:space-y-6">

        <!-- Stats Cards Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
            <div class="bg-white p-3.5 sm:p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[11px] sm:text-xs font-semibold text-slate-400 uppercase">สัญญาทั้งหมด</p>
                    <p id="statTotal" class="text-lg sm:text-2xl font-bold text-slate-800 mt-0.5">0</p>
                </div>
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xs sm:text-base">
                    <i class="fa-solid fa-file-contract"></i>
                </div>
            </div>
            <div class="bg-white p-3.5 sm:p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[11px] sm:text-xs font-semibold text-slate-400 uppercase">กำลังจำนำอยู่</p>

                </div>

        <!-- Filter & Search Bar -->

                </div>

                    <div>
                        <label class="text-xs font-medium text-slate-600">รอบสัญญา (วัน) *</label>
                        <input type="number" id="addContractDays" value="10" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">

    <!-- Modal 2: แก้ไขข้อมูลสัญญา -->

            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-base sm:text-lg font-bold text-slate-800">แก้ไขข้อมูลสัญญา <span id="editDisplayId" class="text-orange-600"></span></h2>
                <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="editForm" onsubmit="handleSaveEdit(event)" class="space-y-3">
                <input type="hidden" id="editId">
                <div>
                    <label class="text-xs font-medium text-slate-600">ชื่อลูกค้า *</label>
                    <input type="text" id="editCustomer" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-600">เบอร์โทรศัพท์</label>

                </div>
                <div>
                    <label class="text-xs font-medium text-slate-600">รายการสินค้า/ทรัพย์สิน *</label>
                    <input type="text" id="editItem" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600">เงินต้น (บาท) *</label>
                        <input type="number" id="editPrincipal" required min="1" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-600">ดอกเบี้ย (%) *</label>

                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600">รอบสัญญา (วัน) *</label>
                        <input type="number" id="editContractDays" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-600">ผ่อนผัน (วัน)</label>
                        <input type="number" id="editGraceDays" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600">วันที่ฝาก *</label>
                        <input type="date" id="editStartDate" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">

                        <option value="กำลังจำนำ">กำลังจำนำ</option>

                    <button type="submit" class="w-full sm:w-auto px-5 py-2.5 text-sm bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-medium shadow-sm">บันทึกการแก้ไข</button>

    <!-- Script ควบคุมระบบ -->
    <script>
        let pawnRecords = [];
        let currentFilter = 'all';

        document.getElementById('addStartDate').valueAsDate = new Date();

        async function fetchPawns() {
            try {
                const res = await fetch('/api/pawns');
                if (res.ok) {
                    pawnRecords = await res.json();
                    renderTable();
                } else {
                    const errData = await res.json();
                    alert(`เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ${errData.error || 'ไม่สามารถโหลดข้อมูลได้'}`);
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function calculateDaysDifference(targetDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const parts = targetDateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            targetDate.setHours(0, 0, 0, 0);

            const diffInMs = targetDate.getTime() - today.getTime();
            return Math.round(diffInMs / (1000 * 60 * 60 * 24));
        }

        function calculateFine(principal, dueDateStr) {
            const diffDaysDue = calculateDaysDifference(dueDateStr);
            if (diffDaysDue < 0) {
                const overdueDays = Math.abs(diffDaysDue);
                const finePerDay = principal * 0.01;
                const totalFine = overdueDays * finePerDay;
                return { overdueDays, finePerDay, totalFine };
            }
            return { overdueDays: 0, finePerDay: 0, totalFine: 0 };
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'overdue', 'redeemed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "whitespace-nowrap px-3 py-1.5 text-xs font-medium rounded-lg border bg-orange-500 text-white border-orange-500 shadow-sm";
                } else {
                    btn.className = "whitespace-nowrap px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-200";
                }
            });
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('pawnContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = pawnRecords.filter(r => {
                const matchSearch = r.customer_name.toLowerCase().includes(search) || 
                                    r.item_name.toLowerCase().includes(search) || 
                                    (r.phone && r.phone.includes(search)) ||
                                    r.id.toString() === search;
                
                const diffDaysDue = calculateDaysDifference(r.due_date);
                const isOverdue = r.status === 'กำลังจำนำ' && diffDaysDue < 0;

                if (currentFilter === 'active') return matchSearch && r.status === 'กำลังจำนำ';
                if (currentFilter === 'overdue') return matchSearch && isOverdue;
                if (currentFilter === 'redeemed') return matchSearch && r.status === 'ไถ่ถอนแล้ว';
                return matchSearch;
            });

            // อัปเดตสถิติด้านบน
            document.getElementById('statTotal').innerText = pawnRecords.length;
            document.getElementById('statActive').innerText = pawnRecords.filter(r => r.status === 'กำลังจำนำ').length;
            document.getElementById('statOverdue').innerText = pawnRecords.filter(r => r.status === 'กำลังจำนำ' && calculateDaysDifference(r.due_date) < 0).length;
            const totalSum = pawnRecords.filter(r => r.status === 'กำลังจำนำ').reduce((acc, r) => acc + r.principal, 0);
            document.getElementById('statAmount').innerText = `฿${totalSum.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-400 text-xs sm:text-sm">ไม่พบรายการสัญญา</div>`;
                return;
            }

            // HTML สำหรับ Mobile Cards View (< md Screen)
            const mobileCardsHtml = `
                <div class="block md:hidden space-y-3">
                    ${filtered.map(r => {
                        const parts = r.due_date.split('-');
                        const expiryObj = new Date(parts[0], parts[1] - 1, parts[2]);
                        expiryObj.setDate(expiryObj.getDate() + (r.grace_days || 7));
                        const expiryStr = `${expiryObj.getFullYear()}-${String(expiryObj.getMonth() + 1).padStart(2, '0')}-${String(expiryObj.getDate()).padStart(2, '0')}`;

                        const diffDaysDue = calculateDaysDifference(r.due_date);
                        const diffDaysExpiry = calculateDaysDifference(expiryStr);

                        const dueDateDisplay = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('th-TH');
                        const expiryDateDisplay = expiryObj.toLocaleDateString('th-TH');

                        const normalInterest = r.principal * (r.interest_rate / 100);
                        const fineData = calculateFine(r.principal, r.due_date);

                        let statusBadge = '';
                        if (r.status === 'ไถ่ถอนแล้ว') {
                            statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded-full bg-slate-100 text-slate-600 font-medium">ไถ่ถอนแล้ว</span>`;
                        } else if (diffDaysExpiry < 0) {
                            statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded-full bg-rose-100 text-rose-700 font-bold">หมดสัญญา (หลุดจำนำ)</span>`;
                        } else if (diffDaysDue < 0) {
                            statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded-full bg-rose-100 text-rose-700 font-bold">เลยกำหนด ${fineData.overdueDays} วัน (ค่าปรับ ฿${fineData.totalFine.toLocaleString('th-TH', {minimumFractionDigits:2})})</span>`;
                        } else {
                            statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded-full bg-emerald-100 text-emerald-800 font-medium">⏳ เหลืออีก ${diffDaysDue} วัน</span>`;
                        }

                        return `
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                                <div class="flex justify-between items-start border-b border-slate-100 pb-2.5">
                                    <div>
                                        <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded">#${r.id}</span>
                                        <h3 class="font-bold text-slate-800 text-sm mt-1">${r.customer_name}</h3>
                                        <p class="text-xs text-slate-400">${r.phone || 'ไม่มีเบอร์โทร'}</p>
                                    </div>
                                    <div class="text-right">
                                        ${statusBadge}
                                        <p class="text-xs text-slate-400 mt-1">หมด: ${expiryDateDisplay}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-lg">
                                    <div>
                                        <span class="text-slate-400 block">สินค้า/ทรัพย์สิน</span>
                                        <span class="font-semibold text-slate-700">${r.item_name}</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block">เงินต้น</span>
                                        <span class="font-bold text-orange-600 text-sm">฿${r.principal.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block">เงื่อนไข</span>
                                        <span class="text-slate-600">${r.interest_rate}% / ${r.contract_days} วัน</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block">ดอกเบี้ยปกติ</span>
                                        <span class="text-slate-600">฿${normalInterest.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                                    </div>
                                </div>
                                <div class="flex gap-1.5 pt-1">
                                    <button onclick="openEditModal(${r.id})" class="flex-1 py-2 text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg font-medium active:bg-amber-100">แก้ไข</button>
                                    ${r.status === 'กำลังจำนำ' ? `
                                        <button onclick="handleExtend(${r.id})" class="flex-1 py-2 text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded-lg font-medium active:bg-blue-100">ต่อดอก</button>
                                        <button onclick="handleRedeem(${r.id})" class="flex-1 py-2 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg font-medium active:bg-emerald-100">ไถ่ถอน</button>
                                    ` : ''}
                                    <button onclick="handleDelete(${r.id})" class="px-3 py-2 text-xs bg-rose-50 text-rose-600 border border-rose-200 rounded-lg active:bg-rose-100"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            // HTML สำหรับ Desktop Table View (>= md Screen)
            const desktopTableHtml = `
                <div class="hidden md:block bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                                    <th class="p-4">ID</th>
                                    <th class="p-4">ข้อมูลลูกค้า</th>
                                    <th class="p-4">รายการสินค้า</th>
                                    <th class="p-4">เงินต้น</th>
                                    <th class="p-4">เงื่อนไข</th>
                                    <th class="p-4">กำหนดชำระ / หมดสัญญา</th>
                                    <th class="p-4">นับถอยหลัง / สถานะ & ค่าปรับ</th>
                                    <th class="p-4 text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.map(r => {
                                    const parts = r.due_date.split('-');
                                    const expiryObj = new Date(parts[0], parts[1] - 1, parts[2]);
                                    expiryObj.setDate(expiryObj.getDate() + (r.grace_days || 7));
                                    const expiryStr = `${expiryObj.getFullYear()}-${String(expiryObj.getMonth() + 1).padStart(2, '0')}-${String(expiryObj.getDate()).padStart(2, '0')}`;

                                    const diffDaysDue = calculateDaysDifference(r.due_date);
                                    const diffDaysExpiry = calculateDaysDifference(expiryStr);

                                    const dueDateDisplay = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('th-TH');
                                    const expiryDateDisplay = expiryObj.toLocaleDateString('th-TH');

                                    const normalInterest = r.principal * (r.interest_rate / 100);
                                    const fineData = calculateFine(r.principal, r.due_date);

                                    let statusBadge = '';
                                    if (r.status === 'ไถ่ถอนแล้ว') {
                                        statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-slate-100 text-slate-600 font-medium">ไถ่ถอนแล้ว</span>`;
                                    } else if (diffDaysExpiry < 0) {
                                        statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-rose-100 text-rose-700 font-bold">หมดสัญญา (หลุดจำนำ)</span>`;
                                    } else if (diffDaysDue < 0) {
                                        statusBadge = `
                                            <div class="space-y-1">
                                                <span class="px-2 py-0.5 text-xs rounded-md bg-rose-100 text-rose-700 font-bold block">
                                                    เลยกำหนด ${fineData.overdueDays} วัน (ค่าปรับ ฿${fineData.totalFine.toLocaleString('th-TH', {minimumFractionDigits: 2})})
                                                </span>
                                                <span class="text-xs text-amber-600 font-medium block">เหลืออีก ${diffDaysExpiry} วันหมดสัญญา</span>
                                            </div>`;
                                    } else {
                                        statusBadge = `
                                            <div class="space-y-1">
                                                <span class="px-2 py-0.5 text-xs rounded-md bg-emerald-100 text-emerald-800 font-medium block">⏳ เหลืออีก ${diffDaysDue} วันครบกำหนด</span>
                                                <span class="text-xs text-slate-500 block">เหลืออีก ${diffDaysExpiry} วันหมดสัญญา</span>
                                            </div>`;
                                    }

                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-4 font-bold text-orange-600">#${r.id}</td>
                                            <td class="p-4">
                                                <div class="font-medium text-slate-800">${r.customer_name}</div>
                                                <div class="text-xs text-slate-400">${r.phone || '-'}</div>
                                            </td>
                                            <td class="p-4 font-medium text-slate-700">${r.item_name}</td>
                                            <td class="p-4 font-bold text-slate-800">฿${r.principal.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                                            <td class="p-4 text-xs text-slate-600">
                                                <div>${r.interest_rate}% / ${r.contract_days} วัน</div>
                                                <div class="text-slate-400">ดอกเบี้ย: ฿${normalInterest.toLocaleString('th-TH', {minimumFractionDigits: 2})}</div>
                                            </td>
                                            <td class="p-4 text-xs">
                                                <div class="font-medium text-slate-700">ครบ: ${dueDateDisplay}</div>
                                                <div class="text-slate-400">หมด: ${expiryDateDisplay}</div>
                                            </td>
                                            <td class="p-4">${statusBadge}</td>
                                            <td class="p-4 text-center space-x-1">
                                                <button onclick="openEditModal(${r.id})" class="px-2 py-1 text-xs bg-amber-50 text-amber-600 rounded hover:bg-amber-100 font-medium"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                                                ${r.status === 'กำลังจำนำ' ? `
                                                    <button onclick="handleExtend(${r.id})" class="px-2 py-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100 font-medium">ต่อดอก</button>
                                                    <button onclick="handleRedeem(${r.id})" class="px-2 py-1 text-xs bg-emerald-50 text-emerald-600 rounded hover:bg-emerald-100 font-medium">ไถ่ถอน</button>
                                                ` : ''}
                                                <button onclick="handleDelete(${r.id})" class="px-2 py-1 text-xs bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = mobileCardsHtml + desktopTableHtml;
        }

        function openEditModal(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            document.getElementById('editId').value = record.id;
            document.getElementById('editDisplayId').innerText = `#${record.id}`;
            document.getElementById('editCustomer').value = record.customer_name;
            document.getElementById('editPhone').value = record.phone || '';
            document.getElementById('editItem').value = record.item_name;
            document.getElementById('editPrincipal').value = record.principal;
            document.getElementById('editInterestRate').value = record.interest_rate;
            document.getElementById('editContractDays').value = record.contract_days;
            document.getElementById('editGraceDays').value = record.grace_days || 7;
            document.getElementById('editStartDate').value = record.start_date;
            document.getElementById('editDueDate').value = record.due_date;
            document.getElementById('editStatus').value = record.status;

            openModal('editModal');
        }

        async function handleSaveEdit(e) {
            e.preventDefault();

            const payload = {
                id: parseInt(document.getElementById('editId').value),
                customer_name: document.getElementById('editCustomer').value,
                phone: document.getElementById('editPhone').value,
                item_name: document.getElementById('editItem').value,
                principal: parseFloat(document.getElementById('editPrincipal').value),
                interest_rate: parseFloat(document.getElementById('editInterestRate').value),
                contract_days: parseInt(document.getElementById('editContractDays').value),
                grace_days: parseInt(document.getElementById('editGraceDays').value),
                start_date: document.getElementById('editStartDate').value,
                due_date: document.getElementById('editDueDate').value,
                status: document.getElementById('editStatus').value
            };

            const res = await fetch('/api/pawns', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeModal('editModal');
                fetchPawns();
            } else {
                const errData = await res.json();
                alert(`แก้ไขข้อมูลไม่สำเร็จ: ${errData.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'}`);
            }
        }

        async function handleAdd(e) {
            e.preventDefault();
            const startDateObj = new Date(document.getElementById('addStartDate').value);
            const contractDays = parseInt(document.getElementById('addContractDays').value);
            
            const dueDateObj = new Date(startDateObj);
            dueDateObj.setDate(dueDateObj.getDate() + contractDays);

            const payload = {
                customer_name: document.getElementById('addCustomer').value,
                phone: document.getElementById('addPhone').value,
                item_name: document.getElementById('addItem').value,
                principal: parseFloat(document.getElementById('addPrincipal').value),
                interest_rate: parseFloat(document.getElementById('addInterestRate').value),
                contract_days: contractDays,
                grace_days: parseInt(document.getElementById('addGraceDays').value),
                start_date: document.getElementById('addStartDate').value,
                due_date: `${dueDateObj.getFullYear()}-${String(dueDateObj.getMonth() + 1).padStart(2, '0')}-${String(dueDateObj.getDate()).padStart(2, '0')}`
            };

            const res = await fetch('/api/pawns', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeModal('addModal');
                document.getElementById('addForm').reset();
                document.getElementById('addStartDate').valueAsDate = new Date();
                fetchPawns();
            } else {
                const errData = await res.json();
                alert(`บันทึกไม่สำเร็จ: ${errData.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'}`);
            }
        }

        async function handleExtend(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            const normalInterest = record.principal * (record.interest_rate / 100);
            const fineData = calculateFine(record.principal, record.due_date);
            const totalPay = normalInterest + fineData.totalFine;

            const parts = record.due_date.split('-');
            const currentDue = new Date(parts[0], parts[1] - 1, parts[2]);
            currentDue.setDate(currentDue.getDate() + record.contract_days);

            const newDueDateStr = `${currentDue.getFullYear()}-${String(currentDue.getMonth() + 1).padStart(2, '0')}-${String(currentDue.getDate()).padStart(2, '0')}`;

            let confirmMsg = `ยืนยันการรับชำระต่อดอกเบี้ยสำหรับสัญญา #${id}?\n\n`;
            confirmMsg += `- ดอกเบี้ยปกติ: ฿${normalInterest.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            if (fineData.totalFine > 0) {
                confirmMsg += `- ค่าปรับเลยกำหนด (${fineData.overdueDays} วัน x 1%): ฿${fineData.totalFine.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            }
            confirmMsg += `👉 ยอดชำระรวมทั้งสิ้น: ฿${totalPay.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            confirmMsg += `📅 วันครบกำหนดใหม่จะเป็น: ${currentDue.toLocaleDateString('th-TH')}`;

            if (confirm(confirmMsg)) {
                record.due_date = newDueDateStr;
                await fetch('/api/pawns', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                fetchPawns();
            }
        }

        async function handleRedeem(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            const normalInterest = record.principal * (record.interest_rate / 100);
            const fineData = calculateFine(record.principal, record.due_date);
            const totalPay = record.principal + normalInterest + fineData.totalFine;

            let confirmMsg = `ยืนยันการรับชำระเงินและไถ่ถอนคืนสินค้าสำหรับสัญญา #${id}?\n\n`;
            confirmMsg += `- เงินต้น: ฿${record.principal.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            confirmMsg += `- ดอกเบี้ย: ฿${normalInterest.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            if (fineData.totalFine > 0) {
                confirmMsg += `- ค่าปรับเลยกำหนด (${fineData.overdueDays} วัน): ฿${fineData.totalFine.toLocaleString('th-TH', {minimumFractionDigits: 2})}\n`;
            }
            confirmMsg += `👉 ยอดชำระไถ่ถอนรวมทั้งสิ้น: ฿${totalPay.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;

            if (confirm(confirmMsg)) {
                record.status = 'ไถ่ถอนแล้ว';
                await fetch('/api/pawns', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                fetchPawns();
            }
        }

        async function handleDelete(id) {
            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบสัญญา #${id}?`)) {
                await fetch(`/api/pawns?id=${id}`, { method: 'DELETE' });
                fetchPawns();
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        fetchPawns();
    </script>
</body>
</html>
