    <script>
        // โครงสร้างข้อมูลตั้งต้น
        let pawnRecords = JSON.parse(localStorage.getItem('pawnshop_records')) || [];
        let currentActiveRecordId = null;
        let currentActionMode = null; // 'extend' หรือ 'redeem'

        // แสดงวันที่ปัจจุบัน
        document.getElementById('current-date-display').innerText = `วันที่ปัจจุบัน: ${new Date().toLocaleDateString('th-TH')}`;

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        renderTable();

        function saveToStorage() {
            localStorage.setItem('pawnshop_records', JSON.stringify(pawnRecords));
            renderTable();
        }

        // คำนวณดอกเบี้ยและค่าปรับ (คำนวณตามอัตราดอกเบี้ยและจำนวนวันที่ตั้งไว้)
        function calculateStatus(record) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const dueDate = new Date(record.dueDate);
            dueDate.setHours(0, 0, 0, 0);

            const principal = parseFloat(record.principal);
            const rate = record.interestRate !== undefined ? parseFloat(record.interestRate) : 5;
            const termDays = record.termDays !== undefined ? parseInt(record.termDays) : 10;
            
            // ดอกเบี้ยตามอัตรา % ของเงินต้น
            const interest = principal * (rate / 100);

            // คำนวณจำนวนวันที่เกินกำหนด
            const diffTime = today - dueDate;
            const overdueDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));

            // ค่าปรับ 1% ของเงินต้นต่อวันที่เกินกำหนด
            const fine = overdueDays > 0 ? (principal * 0.01 * overdueDays) : 0;
            const totalToPay = principal + interest + fine;

            return {
                interest,
                overdueDays,
                fine,
                totalToPay,
                isOverdue: overdueDays > 0,
                rate,
                termDays
            };
        }

        // แสดงตารางและสถิติ
        function renderTable() {
            const tbody = document.getElementById('pawn-table-body');
            tbody.innerHTML = '';

            let totalCount = pawnRecords.length;
            let activeCount = 0;
            let overdueCount = 0;
            let totalPrincipal = 0;

            if (pawnRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-gray-400">ยังไม่มีรายการจำนำในระบบ กดปุ่ม "ฝากสินค้าใหม่" เพื่อเริ่มต้น</td></tr>`;
            }

            pawnRecords.forEach(r => {
                const calc = calculateStatus(r);
                
                if (r.status === 'กำลังจำนำ') {
                    activeCount++;
                    totalPrincipal += parseFloat(r.principal);
                    if (calc.isOverdue) overdueCount++;
                }

                let statusBadge = '';
                if (r.status === 'ไถ่ถอนแล้ว') {
                    statusBadge = `<span class="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full text-xs font-medium">ไถ่ถอนแล้ว</span>`;
                } else if (calc.isOverdue) {
                    statusBadge = `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-medium">เกินกำหนด ${calc.overdueDays} วัน (ปรับ ฿${calc.fine.toFixed(2)})</span>`;
                } else {
                    statusBadge = `<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-medium">ปกติ (ดอก ฿${calc.interest.toFixed(2)})</span>`;
                }

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 border-b';
                row.innerHTML = `
                    <td class="p-3 font-semibold text-amber-700">#${r.id}</td>
                    <td class="p-3 font-medium">${r.customerName}</td>
                    <td class="p-3">${r.itemName}</td>
                    <td class="p-3 font-semibold">฿${parseFloat(r.principal).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                    <td class="p-3 text-amber-800 font-medium">${calc.rate}% / ${calc.termDays} วัน</td>
                    <td class="p-3 text-gray-500">${new Date(r.startDate).toLocaleDateString('th-TH')}</td>
                    <td class="p-3 text-gray-500">${new Date(r.dueDate).toLocaleDateString('th-TH')}</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 text-center flex justify-center items-center gap-1 flex-wrap">
                        <button onclick="openEditModal(${r.id})" class="bg-amber-50 text-amber-700 hover:bg-amber-100 px-2.5 py-1 rounded-md text-xs font-medium transition" title="แก้ไขข้อมูล">
                            <i class="fa-solid fa-pen-to-square"></i> แก้ไข
                        </button>
                        ${r.status === 'กำลังจำนำ' ? `
                            <button onclick="openActionModal(${r.id}, 'extend')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2.5 py-1 rounded-md text-xs font-medium transition">
                                <i class="fa-solid fa-arrows-rotate"></i> ต่อดอก
                            </button>
                            <button onclick="openActionModal(${r.id}, 'redeem')" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2.5 py-1 rounded-md text-xs font-medium transition">
                                <i class="fa-solid fa-hand-holding-dollar"></i> ไถ่ถอน
                            </button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });

            // อัปเดตการ์ด Dashboard
            document.getElementById('stat-total').innerText = totalCount;
            document.getElementById('stat-active').innerText = activeCount;
            document.getElementById('stat-overdue').innerText = overdueCount;
            document.getElementById('stat-principal').innerText = `฿${totalPrincipal.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
        }

        function openNewPawnModal() {
            document.getElementById('pawn-form').reset();
            document.getElementById('interest-rate').value = "5";
            document.getElementById('term-days').value = "10";
            document.getElementById('start-date').valueAsDate = new Date();
            document.getElementById('new-pawn-modal').classList.remove('hidden');
        }

        function closeNewPawnModal() {
            document.getElementById('new-pawn-modal').classList.add('hidden');
        }

        function handleNewPawn(event) {
            event.preventDefault();
            
            const customerName = document.getElementById('customer-name').value;
            const itemName = document.getElementById('item-name').value;
            const principal = parseFloat(document.getElementById('principal-amount').value);
            const interestRate = parseFloat(document.getElementById('interest-rate').value) || 5;
            const termDays = parseInt(document.getElementById('term-days').value) || 10;
            const startDateInput = document.getElementById('start-date').value;

            const startDate = startDateInput ? new Date(startDateInput) : new Date();
            const dueDate = new Date(startDate);
            dueDate.setDate(dueDate.getDate() + termDays);

            const newRecord = {
                id: pawnRecords.length > 0 ? Math.max(...pawnRecords.map(r => r.id)) + 1 : 1,
                customerName,
                itemName,
                principal,
                interestRate,
                termDays,
                startDate: startDate.toISOString(),
                dueDate: dueDate.toISOString(),
                status: 'กำลังจำนำ'
            };

            pawnRecords.push(newRecord);
            saveToStorage();
            closeNewPawnModal();
        }

        // จัดการ Modal ดู/แก้ไขสัญญา
        function openEditModal(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            document.getElementById('edit-pawn-id').innerText = `#${record.id}`;
            document.getElementById('edit-id').value = record.id;
            document.getElementById('edit-customer-name').value = record.customerName;
            document.getElementById('edit-item-name').value = record.itemName;
            document.getElementById('edit-principal').value = record.principal;
            document.getElementById('edit-interest-rate').value = record.interestRate !== undefined ? record.interestRate : 5;
            document.getElementById('edit-term-days').value = record.termDays !== undefined ? record.termDays : 10;
            
            // Format dates YYYY-MM-DD for date inputs
            document.getElementById('edit-start-date').value = new Date(record.startDate).toISOString().split('T')[0];
            document.getElementById('edit-due-date').value = new Date(record.dueDate).toISOString().split('T')[0];
            document.getElementById('edit-status').value = record.status;

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function handleSaveEdit(event) {
            event.preventDefault();
            const id = parseInt(document.getElementById('edit-id').value);
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            record.customerName = document.getElementById('edit-customer-name').value;
            record.itemName = document.getElementById('edit-item-name').value;
            record.principal = parseFloat(document.getElementById('edit-principal').value);
            record.interestRate = parseFloat(document.getElementById('edit-interest-rate').value);
            record.termDays = parseInt(document.getElementById('edit-term-days').value);
            record.startDate = new Date(document.getElementById('edit-start-date').value).toISOString();
            record.dueDate = new Date(document.getElementById('edit-due-date').value).toISOString();
            record.status = document.getElementById('edit-status').value;

            saveToStorage();
            closeEditModal();
        }

        function deletePawnRecord() {
            const id = parseInt(document.getElementById('edit-id').value);
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            // ยืนยันการลบแบบเรียบง่าย
            const confirmDelete = window.confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบสัญญา #${id} (${record.itemName}) ออกจากระบบ?`);
            if (confirmDelete) {
                pawnRecords = pawnRecords.filter(r => r.id !== id);
                saveToStorage();
                closeEditModal();
            }
        }
