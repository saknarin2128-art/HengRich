<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านรับจำนำ Cloud System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header Bar -->
    <header class="bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-store text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold">ระบบจัดการร้านรับจำนำ</h1>
                    <p class="text-xs text-amber-100">HengRich Cloud D1 Connected</p>
                </div>
            </div>
            <button onclick="openModal('addModal')" class="bg-white text-orange-600 hover:bg-orange-50 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> ฝากสินค้าใหม่
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">สัญญาทั้งหมด</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-800">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i class="fa-solid fa-file-contract"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">กำลังจำนำอยู่</p>
                    <p id="statActive" class="text-2xl font-bold text-emerald-600">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                    <i class="fa-solid fa-box-archive"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">เลยกำหนดชำระ</p>
                    <p id="statOverdue" class="text-2xl font-bold text-rose-600">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">ยอดเงินฝากรวม</p>
                    <p id="statAmount" class="text-2xl font-bold text-orange-600">฿0.00</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center">
                    <i class="fa-solid fa-vault"></i>
                </div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="ค้นหาชื่อ, เบอร์โทร, สินค้า..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 text-xs font-medium rounded-lg border bg-orange-500 text-white border-orange-500">ทั้งหมด</button>
                <button onclick="setFilter('active')" id="filter-active" class="px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-300">กำลังจำนำ</button>
                <button onclick="setFilter('overdue')" id="filter-overdue" class="px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-300">เลยกำหนด</button>
                <button onclick="setFilter('redeemed')" id="filter-redeemed" class="px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-300">ไถ่ถอนแล้ว</button>
            </div>
        </div>

        <!-- Main Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                            <th class="p-4">ID</th>
                            <th class="p-4">ข้อมูลลูกค้า</th>
                            <th class="p-4">รายการสินค้า</th>
                            <th class="p-4">เงินต้น</th>
                            <th class="p-4">เงื่อนไข</th>
                            <th class="p-4">กำหนดชำระ / หมดสัญญา</th>
                            <th class="p-4">นับถอยหลัง / สถานะ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="pawnTableBody" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="text-center p-8 text-slate-400">กำลังโหลดข้อมูลจากคลาวด์...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal ฝากสินค้าใหม่ -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-slate-800">ทำรายการฝากสินค้าใหม่</h2>
            <form id="addForm" onsubmit="handleAdd(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-medium text-slate-600">ชื่อลูกค้า *</label>
                    <input type="text" id="addCustomer" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-600">เบอร์โทรศัพท์</label>
                    <input type="text" id="addPhone" placeholder="08X-XXX-XXXX" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-600">รายการสินค้า/ทรัพย์สิน *</label>
                    <input type="text" id="addItem" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600">จำนวนเงินต้น (บาท) *</label>
                        <input type="number" id="addPrincipal" required min="1" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-600">ดอกเบี้ย (%) *</label>
                        <input type="number" id="addInterestRate" step="0.1" value="5" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600">รอบสัญญา (วัน) *</label>
                        <input type="number" id="addContractDays" value="10" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-600">ระยะผ่อนผัน (วัน)</label>
                        <input type="number" id="addGraceDays" value="7" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-600">วันที่ฝาก *</label>
                    <input type="date" id="addStartDate" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 text-sm bg-slate-100 text-slate-600 rounded-lg">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-orange-500 text-white rounded-lg font-medium">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let pawnRecords = [];
        let currentFilter = 'all';

        document.getElementById('addStartDate').valueAsDate = new Date();

        async function fetchPawns() {
            try {
                const res = await fetch('/api/pawns');
                pawnRecords = await res.json();
                renderTable();
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'overdue', 'redeemed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-3 py-1.5 text-xs font-medium rounded-lg border bg-orange-500 text-white border-orange-500";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-300";
                }
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('pawnTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let filtered = pawnRecords.filter(r => {
                const matchSearch = r.customer_name.toLowerCase().includes(search) || 
                                    r.item_name.toLowerCase().includes(search) || 
                                    (r.phone && r.phone.includes(search)) ||
                                    r.id.toString() === search;
                
                const dueDate = new Date(r.due_date);
                const isOverdue = r.status === 'กำลังจำนำ' && dueDate < today;

                if (currentFilter === 'active') return matchSearch && r.status === 'กำลังจำนำ';
                if (currentFilter === 'overdue') return matchSearch && isOverdue;
                if (currentFilter === 'redeemed') return matchSearch && r.status === 'ไถ่ถอนแล้ว';
                return matchSearch;
            });

            // Update Stats
            document.getElementById('statTotal').innerText = pawnRecords.length;
            document.getElementById('statActive').innerText = pawnRecords.filter(r => r.status === 'กำลังจำนำ').length;
            document.getElementById('statOverdue').innerText = pawnRecords.filter(r => r.status === 'กำลังจำนำ' && new Date(r.due_date) < today).length;
            const totalSum = pawnRecords.filter(r => r.status === 'กำลังจำนำ').reduce((acc, r) => acc + r.principal, 0);
            document.getElementById('statAmount').innerText = `฿${totalSum.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center p-8 text-slate-400">ไม่พบรายการสัญญา</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(r => {
                const startDate = new Date(r.start_date);
                const dueDate = new Date(r.due_date);
                const expiryDate = new Date(dueDate);
                expiryDate.setDate(expiryDate.getDate() + (r.grace_days || 7));

                const diffDaysDue = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                const diffDaysExpiry = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));

                let statusBadge = '';
                if (r.status === 'ไถ่ถอนแล้ว') {
                    statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-slate-100 text-slate-600 font-medium">ไถ่ถอนแล้ว</span>`;
                } else if (diffDaysExpiry <= 0) {
                    statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-rose-100 text-rose-700 font-bold">หมดสัญญา (หลุดจำนำ)</span>`;
                } else if (diffDaysDue < 0) {
                    statusBadge = `
                        <div class="space-y-1">
                            <span class="px-2 py-0.5 text-xs rounded-md bg-rose-100 text-rose-700 font-bold block">เลยกำหนด ${Math.abs(diffDaysDue)} วัน</span>
                            <span class="text-xs text-amber-600 font-medium block">เหลืออีก ${diffDaysExpiry} วันหมดสัญญา</span>
                        </div>`;
                } else {
                    statusBadge = `
                        <div class="space-y-1">
                            <span class="px-2 py-0.5 text-xs rounded-md bg-emerald-100 text-emerald-800 font-medium block">⏳ เหลืออีก ${diffDaysDue} วันครบกำหนด</span>
                            <span class="text-xs text-slate-500 block">เหลืออีก ${diffDaysExpiry} วันหมดสัญญา</span>
                        </div>`;
                }

                return `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold text-orange-600">#${r.id}</td>
                        <td class="p-4">
                            <div class="font-medium text-slate-800">${r.customer_name}</div>
                            <div class="text-xs text-slate-400">${r.phone || '-'}</div>
                        </td>
                        <td class="p-4 font-medium text-slate-700">${r.item_name}</td>
                        <td class="p-4 font-bold text-slate-800">฿${r.principal.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                        <td class="p-4 text-xs text-slate-600">${r.interest_rate}% / ${r.contract_days} วัน</td>
                        <td class="p-4 text-xs">
                            <div class="font-medium text-slate-700">ครบ: ${dueDate.toLocaleDateString('th-TH')}</div>
                            <div class="text-slate-400">หมด: ${expiryDate.toLocaleDateString('th-TH')}</div>
                        </td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-center space-x-1">
                            ${r.status === 'กำลังจำนำ' ? `
                                <button onclick="handleExtend(${r.id})" class="px-2 py-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100 font-medium">ต่อดอก</button>
                                <button onclick="handleRedeem(${r.id})" class="px-2 py-1 text-xs bg-emerald-50 text-emerald-600 rounded hover:bg-emerald-100 font-medium">ไถ่ถอน</button>
                            ` : ''}
                            <button onclick="handleDelete(${r.id})" class="px-2 py-1 text-xs bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function handleAdd(e) {
            e.preventDefault();
            const startDate = new Date(document.getElementById('addStartDate').value);
            const contractDays = parseInt(document.getElementById('addContractDays').value);
            const dueDate = new Date(startDate);
            dueDate.setDate(dueDate.getDate() + contractDays);

            const payload = {
                customer_name: document.getElementById('addCustomer').value,
                phone: document.getElementById('addPhone').value,
                item_name: document.getElementById('addItem').value,
                principal: parseFloat(document.getElementById('addPrincipal').value),
                interest_rate: parseFloat(document.getElementById('addInterestRate').value),
                contract_days: contractDays,
                grace_days: parseInt(document.getElementById('addGraceDays').value),
                start_date: startDate.toISOString().split('T')[0],
                due_date: dueDate.toISOString().split('T')[0]
            };

            await fetch('/api/pawns', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal('addModal');
            document.getElementById('addForm').reset();
            document.getElementById('addStartDate').valueAsDate = new Date();
            fetchPawns();
        }

        async function handleExtend(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            const currentDue = new Date(record.due_date);
            currentDue.setDate(currentDue.getDate() + record.contract_days);

            if (confirm(`ยืนยันการรับชำระต่อดอกเบี้ย? วันครบกำหนดใหม่จะเป็น: ${currentDue.toLocaleDateString('th-TH')}`)) {
                record.due_date = currentDue.toISOString().split('T')[0];
                await fetch('/api/pawns', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                fetchPawns();
            }
        }

        async function handleRedeem(id) {
            const record = pawnRecords.find(r => r.id === id);
            if (!record) return;

            if (confirm(`ยืนยันการรับชำระเงินและไถ่ถอนคืนสินค้าสำหรับสัญญา #${id}?`)) {
                record.status = 'ไถ่ถอนแล้ว';
                await fetch('/api/pawns', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                fetchPawns();
            }
        }

        async function handleDelete(id) {
            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบสัญญา #${id}?`)) {
                await fetch(`/api/pawns?id=${id}`, { method: 'DELETE' });
                fetchPawns();
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        fetchPawns();
    </script>
</body>
</html>
